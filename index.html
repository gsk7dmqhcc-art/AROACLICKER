<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura Infinite - Architect Overlord</title>
    <style>
        :root {
            --bg: #010103; --glass: rgba(255, 255, 255, 0.02); --border: rgba(255, 255, 255, 0.08);
            --accent: #00ffaa; --prestige: #ff00ea; --dev: #ffcc00; --alert: #00d4ff; --online: #22ff22;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: white; margin: 0; display: grid; grid-template-columns: 320px 1fr 320px; height: 100vh; overflow: hidden; background-image: radial-gradient(circle at 50% 50%, #0a0a15 0%, #010103 100%); }
        @media (max-width: 1000px) { body { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; overflow-y: auto; } }

        /* Announcement Bar */
        #announcement-bar {
            position: fixed; top: 0; left: 0; width: 100%; height: 35px;
            background: rgba(0,0,0,0.9); border-bottom: 1px solid var(--border);
            z-index: 1000; display: flex; align-items: center; padding: 0 20px;
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; box-shadow: 0 0 10px var(--online); background: var(--online); }
        .player-count { font-size: 10px; color: var(--online); margin-right: 20px; font-weight: bold; font-family: monospace; }

        .ticker-wrap { flex-grow: 1; overflow: hidden; white-space: nowrap; }
        .ticker-text { display: inline-block; animation: scroll 30s linear infinite; color: var(--alert); font-size: 11px; letter-spacing: 1px; font-weight: bold; }
        @keyframes scroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* Panels */
        .panel { background: var(--glass); backdrop-filter: blur(30px); border: 1px solid var(--border); padding: 20px; margin: 10px; margin-top: 50px; border-radius: 24px; overflow-y: auto; }
        .main-view { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        #node { width: 220px; height: 220px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.01); cursor: pointer; transition: 0.1s; box-shadow: 0 0 50px rgba(0, 255, 170, 0.05); }
        #node:active { transform: scale(0.94); }

        /* MEGA DEV MENU */
        #dev-menu { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; padding: 30px; overflow-y: auto; }
        .dev-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .dev-btn { background: #111; border: 1px solid #333; color: var(--dev); padding: 10px; border-radius: 8px; font-size: 10px; cursor: pointer; transition: 0.2s; text-align: center; }
        .dev-btn:hover { background: var(--dev); color: #000; border-color: #fff; }
        .dev-header { color: var(--alert); font-size: 12px; font-weight: bold; margin: 15px 0 10px 0; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .dev-input { background: #111; border: 1px solid #333; color: var(--dev); padding: 12px; width: 100%; border-radius: 8px; margin: 10px 0; }
        
        .upgrade-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); padding: 14px; margin-bottom: 8px; border-radius: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="announcement-bar">
        <div class="status-dot"></div>
        <div class="player-count">LIVE: <span id="p-count">1,402</span></div>
        <div class="ticker-wrap">
            <div id="ticker" class="ticker-text">CONNECTING TO AURA_NET... WELCOME CARSON KIRKPATRICK...</div>
        </div>
    </div>

    <div class="panel">
        <div style="font-size: 10px; opacity: 0.5;">ENERGY</div>
        <div style="font-size: 32px; font-weight: 900; color: var(--accent);" id="energy-display">0</div>
        <div style="color: #666; font-size: 14px;">+ <span id="dps-display">0</span> /s</div>
        <hr style="border:0; border-top:1px solid #222; margin: 20px 0;">
        <div style="font-size: 12px; color: var(--dev);">Architect: Carson Kirkpatrick</div>
    </div>

    <div class="main-view">
        <div id="node"></div>
        <div onclick="openDev()" style="margin-top:20px; font-size:10px; opacity:0.1; cursor:pointer;">[NETWORK_ROOT_v7]</div>
    </div>

    <div class="panel">
        <div id="shop-container"></div>
    </div>

    <div id="dev-menu">
        <div style="display:flex; justify-content:space-between;">
            <h2 style="color:var(--dev); margin:0;">ARCHITECT COMMAND CENTER</h2>
            <button onclick="document.getElementById('dev-menu').style.display='none'" style="background:red; color:white; border:none; padding:5px 15px; border-radius:5px; cursor:pointer;">EXIT</button>
        </div>

        <div class="dev-header">GLOBAL NETWORK BROADCAST</div>
        <input type="text" id="broadcast-msg" class="dev-input" placeholder="Update the live ticker for all players...">
        <button onclick="sendBroadcast()" class="dev-btn" style="width:100%; background:var(--alert); color:black; font-weight:bold;">EMIT GLOBAL SIGNAL</button>

        <div class="dev-header">RESOURCE INJECTION</div>
        <div class="dev-grid">
            <button class="dev-btn" onclick="state.data += 1e6">+1 Million</button>
            <button class="dev-btn" onclick="state.data += 1e9">+1 Billion</button>
            <button class="dev-btn" onclick="state.data += 1e12">+1 Trillion</button>
            <button class="dev-btn" onclick="state.data += 1e15">+1 Quadrillion</button>
        </div>

        <div class="dev-header">PRESTIGE & MULTIPLIERS</div>
        <div class="dev-grid">
            <button class="dev-btn" onclick="state.prestigeMult = 1">Reset Mult</button>
            <button class="dev-btn" onclick="state.prestigeMult *= 2">Mult x2</button>
            <button class="dev-btn" onclick="state.prestigeMult *= 10">Mult x10</button>
            <button class="dev-btn" onclick="state.prestigeMult = 999999">Max Mult</button>
        </div>

        <div class="dev-header">VISUAL HACKS</div>
        <div class="dev-grid">
            <button class="dev-btn" onclick="document.body.style.filter='invert(1)'">Invert</button>
            <button class="dev-btn" onclick="document.body.style.filter='hue-rotate(90deg)'">Hue Shift</button>
            <button class="dev-btn" onclick="document.body.style.filter='none'">Normal</button>
            <button class="dev-btn" onclick="node.style.borderRadius='0'">Square Core</button>
        </div>

        <div class="dev-header">TIME & SPEED</div>
        <div class="dev-grid">
            <button class="dev-btn" onclick="state.data += calculateDPS() * 3600">+1 Hour Progress</button>
            <button class="dev-btn" onclick="state.data += calculateDPS() * 86400">+1 Day Progress</button>
            <button class="dev-btn" onclick="fullWipe()">FACTORY RESET</button>
        </div>
    </div>

<script>
    let state = {
        data: 0,
        prestigeMult: 1,
        upgradeLevels: new Array(1000).fill(0),
        broadcast: "Welcome, Architect Carson Kirkpatrick. All systems online."
    };

    const upgrades = Array.from({length: 1000}, (_, i) => ({
        name: `Module ${i+1}`,
        cost: Math.floor(15 * Math.pow(1.5, i)),
        dps: Math.floor(1.5 * Math.pow(1.45, i))
    }));

    function handleInput(e) {
        if (e.cancelable) e.preventDefault();
        state.data += (1 + (calculateDPS() * 0.05)) * state.prestigeMult;
        updateUI();
    }

    function calculateDPS() {
        return state.upgradeLevels.reduce((sum, lvl, i) => sum + (lvl * upgrades[i].dps), 0) * state.prestigeMult;
    }

    function updateUI() {
        document.getElementById('energy-display').innerText = Math.floor(state.data).toLocaleString();
        document.getElementById('dps-display').innerText = Math.floor(calculateDPS()).toLocaleString();
        document.getElementById('ticker').innerText = state.broadcast;

        const shop = document.getElementById('shop-container');
        shop.innerHTML = '';
        let count = 0;
        for(let i=0; i<1000; i++) {
            const u = upgrades[i];
            const lvl = state.upgradeLevels[i];
            const cost = Math.floor(u.cost * Math.pow(1.15, lvl));
            if(state.data >= u.cost * 0.5 || lvl > 0) {
                const card = document.createElement('div');
                card.className = `upgrade-card ${state.data < cost ? 'disabled' : ''}`;
                card.innerHTML = `<strong>${u.name} (Lv.${lvl})</strong><br>${cost.toLocaleString()}`;
                card.onclick = () => { if(state.data >= cost) { state.data -= cost; state.upgradeLevels[i]++; updateUI(); save(); } };
                shop.appendChild(card);
                count++;
            }
            if(count > 8) break;
        }
    }

    function sendBroadcast() {
        const msg = document.getElementById('broadcast-msg').value;
        if(msg) {
            state.broadcast = "GLOBAL UPDATE: " + msg + " — (Dev: Carson)";
            updateUI();
            alert("Broadcast sent!");
        }
    }

    function fullWipe() { if(confirm("WIPE EVERYTHING?")) { localStorage.clear(); location.reload(); } }
    
    function openDev() { if(prompt("ACCESS KEY:") === "2026") document.getElementById('dev-menu').style.display = 'block'; }
    function save() { localStorage.setItem('aura_v7_save', JSON.stringify(state)); }
    function load() {
        const s = localStorage.getItem('aura_v7_save');
        if(s) state = JSON.parse(s);
    }

    // Live Player Counter simulation
    setInterval(() => {
        document.getElementById('p-count').innerText = (1200 + Math.floor(Math.random()*400)).toLocaleString();
    }, 5000);

    document.getElementById('node').addEventListener('mousedown', handleInput);
    document.getElementById('node').addEventListener('touchstart', handleInput, {passive:false});
    
    setInterval(() => { state.data += calculateDPS() / 10; updateUI(); }, 100);
    load();
    updateUI();
</script>
</body>
</html>
